<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="luis@friday ~ $ ./make-it-work --on linux — I'll make everything work on Linux.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f17"/>
      <stop offset="1" stop-color="#131a2a"/>
    </linearGradient>
    <linearGradient id="hl" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#f0abfc"/>
    </linearGradient>
    <clipPath id="type1"><rect x="0" y="0" height="320" width="0">
      <animate attributeName="width" from="0" to="1200" dur="2.2s" begin="0.4s" fill="freeze" calcMode="discrete"
        values="0;140;175;210;245;280;315;350;385;420;455;490;525;560;595;630;665;700;735;1200" keyTimes="0;0.05;0.1;0.15;0.2;0.25;0.3;0.35;0.4;0.45;0.5;0.55;0.6;0.65;0.7;0.75;0.8;0.85;0.9;1"/>
    </rect></clipPath>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace; }
      .prompt { fill: #7ee787; font-size: 22px; }
      .cmd { fill: #e6edf3; font-size: 22px; }
      .title { font-size: 48px; font-weight: 700; fill: url(#hl); opacity: 0; animation: fade .8s ease-out 2.9s forwards; }
      .sub { fill: #8b949e; font-size: 19px; opacity: 0; animation: fade .8s ease-out 3.5s forwards; }
      .ok { fill: #7ee787; }
      .cursor { fill: #e6edf3; animation: blink 1s steps(1) infinite; }
      @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
      @keyframes blink { 50% { opacity: 0; } }
    </style>
  </defs>

  <rect width="1200" height="320" rx="16" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="1199" height="319" rx="16" fill="none" stroke="#30363d"/>

  <!-- window bar -->
  <circle cx="32" cy="28" r="7" fill="#ff5f57"/>
  <circle cx="56" cy="28" r="7" fill="#febc2e"/>
  <circle cx="80" cy="28" r="7" fill="#28c840"/>
  <text x="600" y="34" text-anchor="middle" class="mono" fill="#6e7681" font-size="15">foot — ~/Projects</text>
  <line x1="0" y1="54" x2="1200" y2="54" stroke="#21262d"/>

  <!-- typed command -->
  <g clip-path="url(#type1)">
    <text x="48" y="104" class="mono"><tspan class="prompt">luis@friday ~ $ </tspan><tspan class="cmd">./make-it-work --on linux</tspan></text>
  </g>

  <!-- result -->
  <text x="48" y="190" class="mono title">I'll make everything work on Linux.</text>
  <text x="48" y="240" class="mono sub"><tspan class="ok">✓</tspan> Power BI  <tspan class="ok">✓</tspan> Hamachi-style LAN  <tspan class="ok">✓</tspan> pen tablets  <tspan class="ok">✓</tspan> Steam upscaling &amp; frame gen</text>
  <text x="48" y="280" class="mono sub">luis@friday ~ $ <tspan class="cursor">█</tspan></text>
</svg>
